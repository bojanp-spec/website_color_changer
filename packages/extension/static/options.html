<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Color Changer</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1>🎨 Website Color Changer</h1>
  <!-- Text is filled in by options.js in the build's language (data-i18n / data-i18n-html). -->
  <p class="muted" data-i18n-html="intro"></p>

  <section>
    <h2 data-i18n="accessTitle"></h2>
    <p id="perm-status" class="muted">…</p>
    <p class="muted" data-i18n="accessExplain"></p>
    <button id="perm-grant" type="button" data-i18n="grant"></button>
    <button id="perm-revoke" type="button" data-i18n="revoke" hidden></button>
  </section>

  <section>
    <h2 data-i18n="savedTitle"></h2>
    <p id="empty" class="muted" data-i18n="empty" hidden></p>
    <ul id="sites"></ul>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
