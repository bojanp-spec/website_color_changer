<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Plavo-sivi sajt (hardkodovane boje)</title>
<link rel="stylesheet" href="styles.css">
<style>
  .note { color: rgba(45, 55, 72, 0.7); border-left: 4px solid hsl(210, 20%, 70%); padding-left: 12px; }
</style>
</head>
<body>
  <div class="topbar">Plavo-siva firma — <a href="#">O nama</a></div>
  <div class="grid">
    <div class="panel">
      <h2>Panel</h2>
      <ul class="list"><li>Stavka jedan</li><li>Stavka dva</li></ul>
      <p class="note">Napomena sa providnom bojom teksta.</p>
    </div>
    <div class="panel">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#2C5282" stroke="#90CDF4" stroke-width="4"/></svg>
      <p style="color: #718096; background-color: #F7FAFC">Inline stil.</p>
      <table><tr><td bgcolor="#E2E8F0">Stara tabela</td></tr></table>
      <form><input type="submit" class="cta" value="Prijavi se"></form>
    </div>
  </div>
</body>
</html>
